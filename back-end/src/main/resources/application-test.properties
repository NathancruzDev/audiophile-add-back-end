# Configuração do PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/teste
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=${POSTGREKEY}

# Hibernate cria/atualiza as tabelas no Postgres automaticamente
spring.jpa.hibernate.ddl-auto=update

# Exibe e formata os comandos SQL no terminal
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desativa o console do H2 já que estamos no Postgres
spring.h2.console.enabled=false